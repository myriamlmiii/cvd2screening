[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvd"
version = "0.1.0"
description = "U-Investors CVD 2.0 sourcing & screening pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyairtable>=2.3",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
docs = ["pymupdf>=1.24"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
cvd-pipeline = "cvd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
