<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>U-Investors — Deal Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#12202f;
    --slate:#4c5c6d;
    --slate-light:#8494a3;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --line:#dedad0;
    --gold:#b8863a;
    --green:#3f7a5b;
    --green-soft:#e4efe8;
    --red:#a6432f;
    --red-soft:#f3e3de;
    --amber:#a97a1f;
    --amber-soft:#f4ecd8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:40px 48px 0;
  }
  .brand{
    font-family:'Newsreader', serif;
    font-size:30px;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  .brand span{ color:var(--gold); font-style:italic; }
  .sub{
    color:var(--slate);
    font-size:14px;
    margin-top:6px;
    max-width:560px;
    line-height:1.5;
  }

  .stats-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1px;
    background:var(--line);
    margin:32px 48px 0;
    border:1px solid var(--line);
  }
  .stat{
    background:var(--panel);
    padding:20px 22px;
  }
  .stat-label{
    font-size:12.5px;
    color:var(--slate-light);
  }
  .stat-value{
    font-family:'Newsreader', serif;
    font-size:30px;
    margin-top:6px;
  }
  .stat-value.accent{ color:var(--gold); }

  .charts-row{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:20px;
    margin:24px 48px 0;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px 22px;
  }
  .panel-title{
    font-size:14px;
    font-weight:500;
    margin-bottom:14px;
  }
  .chart-box{ height:200px; }

  .deals-head{
    margin:40px 48px 16px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .deals-title{
    font-family:'Newsreader', serif;
    font-size:20px;
  }
  .deals-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--slate-light);
  }

  .deal-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:18px;
    margin:0 48px 60px;
  }
  .deal-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px 22px;
  }
  .deal-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .deal-name{
    font-family:'Newsreader', serif;
    font-size:19px;
    font-weight:500;
  }
  .deal-loc{
    font-size:12px;
    color:var(--slate-light);
    margin-top:2px;
  }
  .deal-rec{
    font-size:11.5px;
    font-weight:500;
    padding:4px 10px;
    border-radius:3px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .rec-invest{ background:var(--green-soft); color:var(--green); }
  .rec-discuss{ background:var(--amber-soft); color:var(--amber); }
  .rec-pass{ background:var(--red-soft); color:var(--red); }

  .deal-pitch{
    font-size:13.5px;
    color:var(--slate);
    margin-top:12px;
    line-height:1.5;
  }
  .deal-meta{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
  }
  .meta-item .k{ color:var(--slate-light); display:block; margin-bottom:3px; }
  .meta-item .v{ font-family:'IBM Plex Mono', monospace; color:var(--ink); }

  .score-track{
    margin-top:14px;
    height:5px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .score-fill{ height:100%; border-radius:3px; }
  .score-label{
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    color:var(--slate-light);
    margin-top:6px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">Deal review <span>— this week</span></div>
  <div class="sub">One place to open, scan, and decide. Portfolio signal up top, every submission scored and summarized below.</div>
</header>

<div class="stats-row">
  <div class="stat">
    <div class="stat-label">Submissions this cycle</div>
    <div class="stat-value">8</div>
  </div>
  <div class="stat">
    <div class="stat-label">Average AI score</div>
    <div class="stat-value">74</div>
  </div>
  <div class="stat">
    <div class="stat-label">Flagged for invest</div>
    <div class="stat-value accent">3</div>
  </div>
  <div class="stat">
    <div class="stat-label">Total ask across pipeline</div>
    <div class="stat-value">16.8M MAD</div>
  </div>
</div>

<div class="charts-row">
  <div class="panel">
    <div class="panel-title">Ask size by company</div>
    <div class="chart-box"><canvas id="askChart"></canvas></div>
  </div>
  <div class="panel">
    <div class="panel-title">Sector mix</div>
    <div class="chart-box"><canvas id="sectorChart"></canvas></div>
  </div>
</div>

<div class="deals-head">
  <div class="deals-title">All submissions</div>
  <div class="deals-count">sorted by AI score</div>
</div>

<div class="deal-grid" id="deal-grid"></div>

<script>
const startups = [
  { name:"ClaimFlow", location:"Casablanca", sector:"InsurTech", stage:"Series A", ask:"6,000,000 MAD", askNum:6.0, pitch:"Claims automation for mid-size insurers, cutting processing time from weeks to days.", traction:"3 insurer contracts · 1.2M MAD ARR", score:91, rec:"invest" },
  { name:"CoverCrop", location:"Agadir", sector:"InsurTech", stage:"Seed", ask:"1,500,000 MAD", askNum:1.5, pitch:"Parametric crop insurance triggered by satellite rainfall data.", traction:"500 farmers insured this season", score:88, rec:"invest" },
  { name:"PayNova", location:"Casablanca", sector:"Fintech", stage:"Seed", ask:"2,500,000 MAD", askNum:2.5, pitch:"B2B payments API letting Moroccan SMEs accept and reconcile payments in one flow.", traction:"40k MAD MRR · 12% MoM growth", score:87, rec:"invest" },
  { name:"LendLocal", location:"Casablanca", sector:"Fintech", stage:"Pre-seed", ask:"700,000 MAD", askNum:0.7, pitch:"Alternative credit scoring for SMEs without formal credit history.", traction:"Pilot with 2 microfinance institutions", score:83, rec:"discuss" },
  { name:"AssurLink", location:"Rabat", sector:"InsurTech", stage:"Pre-seed", ask:"900,000 MAD", askNum:0.9, pitch:"Digital broker matching micro-insurance products to informal-sector workers.", traction:"3 pilot partnerships signed", score:79, rec:"discuss" },
  { name:"MedRendezvous", location:"Fes", sector:"HealthTech", stage:"Seed", ask:"1,200,000 MAD", askNum:1.2, pitch:"Clinic booking and patient records platform for private practices.", traction:"15k monthly active users", score:61, rec:"discuss" },
  { name:"FarmSense", location:"Marrakech", sector:"AgriTech", stage:"Seed", ask:"1,800,000 MAD", askNum:1.8, pitch:"IoT soil sensors helping smallholder farms manage irrigation.", traction:"200 units deployed, no recurring revenue yet", score:54, rec:"pass" },
  { name:"ShipEase", location:"Tangier", sector:"Logistics", stage:"Seed", ask:"2,200,000 MAD", askNum:2.2, pitch:"Route optimization for last-mile delivery fleets.", traction:"3 pilot clients", score:48, rec:"pass" },
];

function scoreColor(s){
  if(s>=80) return "#3f7a5b";
  if(s>=65) return "#a97a1f";
  return "#a6432f";
}
function recLabel(r){ return {invest:"Invest", discuss:"Discuss", pass:"Pass"}[r]; }

const grid = document.getElementById("deal-grid");
[...startups].sort((a,b)=>b.score-a.score).forEach(s=>{
  const card = document.createElement("div");
  card.className = "deal-card";
  card.innerHTML = `
    <div class="deal-top">
      <div>
        <div class="deal-name">${s.name}</div>
        <div class="deal-loc">${s.location} · ${s.stage}</div>
      </div>
      <span class="deal-rec rec-${s.rec}">${recLabel(s.rec)}</span>
    </div>
    <div class="deal-pitch">${s.pitch}</div>
    <div class="score-track"><div class="score-fill" style="width:${s.score}%; background:${scoreColor(s.score)}"></div></div>
    <div class="score-label"><span>AI score</span><span>${s.score} / 100</span></div>
    <div class="deal-meta">
      <div class="meta-item"><span class="k">Ask</span><span class="v">${s.ask}</span></div>
      <div class="meta-item"><span class="k">Sector</span><span class="v">${s.sector}</span></div>
      <div class="meta-item" style="text-align:right"><span class="k">Traction</span><span class="v" style="font-size:11.5px">${s.traction}</span></div>
    </div>
  `;
  grid.appendChild(card);
});

new Chart(document.getElementById("askChart"), {
  type: "bar",
  data: {
    labels: startups.map(s=>s.name),
    datasets: [{
      data: startups.map(s=>s.askNum),
      backgroundColor: "#b8863a",
      borderRadius: 3,
      maxBarThickness: 28,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:false} },
    scales:{
      x:{ grid:{display:false}, ticks:{ font:{family:"IBM Plex Sans", size:11}, color:"#4c5c6d" } },
      y:{ grid:{color:"#eeece4"}, ticks:{ font:{family:"IBM Plex Mono", size:10}, color:"#8494a3", callback:v=>v+"M" } }
    }
  }
});

const sectorCounts = startups.reduce((acc,s)=>{ acc[s.sector]=(acc[s.sector]||0)+1; return acc; }, {});
new Chart(document.getElementById("sectorChart"), {
  type: "doughnut",
  data: {
    labels: Object.keys(sectorCounts),
    datasets: [{
      data: Object.values(sectorCounts),
      backgroundColor: ["#12202f","#b8863a","#3f7a5b","#a6432f","#8494a3"],
      borderColor: "#ffffff",
      borderWidth: 2,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ position:"right", labels:{ font:{family:"IBM Plex Sans", size:11.5}, color:"#4c5c6d", boxWidth:10, padding:12 } } }
  }
});
</script>

</body>
</html>
